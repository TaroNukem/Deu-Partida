spring.application.name=aluguel-carros
server.port=8080

# Lê o arquivo backend/.env (se existir) como se fossem propriedades
spring.config.import=optional:file:.env[.properties]

# Banco (Supabase)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: cria/atualiza as tabelas sozinho a partir das @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}